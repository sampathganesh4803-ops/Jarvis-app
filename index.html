<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>J.A.R.V.I.S. Personal System</title>
  <link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%22JARVIS%22%2C%22short_name%22%3A%22JARVIS%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23020617%22%2C%22theme_color%22%3A%22%2306b6d4%22%7D">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #020617; color: #38bdf8; font-family: ui-monospace, monospace; }
    .hud-box { border: 1px solid rgba(56, 189, 248, 0.3); background: rgba(15, 23, 42, 0.7); box-shadow: 0 0 15px rgba(56, 189, 248, 0.15); }
    .arc-pulse { animation: pulseCore 2.5s infinite ease-in-out; }
    @keyframes pulseCore { 0%, 100% { transform: scale(1); filter: drop-shadow(0 0 10px #06b6d4); } 50% { transform: scale(1.06); filter: drop-shadow(0 0 25px #38bdf8); } }
  </style>
</head>
<body class="min-h-screen p-4 flex flex-col items-center justify-between">
  <header class="w-full max-w-md flex justify-between items-center py-2 border-b border-cyan-800 text-xs">
    <span class="tracking-widest font-bold text-cyan-400">J.A.R.V.I.S. OS v4.2</span>
    <span id="sys-clock" class="text-cyan-600">00:00:00</span>
  </header>

  <main class="w-full max-w-md flex flex-col items-center my-auto space-y-6">
    <div class="relative flex items-center justify-center w-52 h-52">
      <div class="absolute inset-0 rounded-full border border-cyan-500/20 animate-spin" style="animation-duration: 15s;"></div>
      <div class="absolute inset-2 rounded-full border border-dashed border-cyan-400/30 animate-spin" style="animation-duration: 25s; animation-direction: reverse;"></div>
      <div id="arc-core" class="w-32 h-32 rounded-full border-2 border-cyan-300 hud-box flex flex-col items-center justify-center cursor-pointer arc-pulse transition-all">
        <div class="w-12 h-12 rounded-full bg-cyan-400/20 border border-cyan-200 flex items-center justify-center">
          <div class="w-4 h-4 rounded-full bg-cyan-300"></div>
        </div>
        <span id="arc-label" class="text-[10px] uppercase font-bold tracking-widest mt-2 text-cyan-200">STANDBY</span>
      </div>
    </div>

    <div class="w-full hud-box p-3 rounded-lg text-xs space-y-2">
      <div class="flex justify-between text-cyan-400 font-semibold border-b border-cyan-950 pb-1">
        <span>DATA CONSENT VAULT</span>
        <span class="text-emerald-400">ACTIVE</span>
      </div>
      <div class="grid grid-cols-2 gap-2 text-[11px] text-slate-300">
        <div>• Device Storage: <span class="text-emerald-400">Granted</span></div>
        <div>• Microphone: <span class="text-emerald-400">Ready</span></div>
        <div>• Location Link: <span class="text-cyan-400">Restricted</span></div>
        <div>• Autonomous Ops: <span class="text-emerald-400">Enabled</span></div>
      </div>
    </div>

    <div class="w-full hud-box p-3 rounded-lg h-36 flex flex-col justify-between text-xs">
      <div class="text-[11px] text-cyan-500 font-semibold uppercase tracking-wider">Communication Log</div>
      <div id="dialogue-box" class="overflow-y-auto max-h-20 text-slate-200 space-y-1">
        <p class="text-cyan-300 font-medium">J.A.R.V.I.S.: Systems initialized and awaiting your command, sir.</p>
      </div>
      <div class="flex gap-2 pt-2 border-t border-cyan-950">
        <input id="user-input" type="text" placeholder="Speak or type a command..." class="bg-slate-900 border border-cyan-800 rounded px-2 py-1 flex-1 text-cyan-200 focus:outline-none focus:border-cyan-400 text-xs">
        <button id="send-btn" class="bg-cyan-600 hover:bg-cyan-500 text-slate-950 font-bold px-3 py-1 rounded text-xs">RUN</button>
      </div>
    </div>
  </main>

  <footer class="w-full max-w-md text-center py-2 text-[10px] text-cyan-700">
    STARK SECURE SUITE // WITH USER CONSENT PROTOCOLS
  </footer>

  <script>
    setInterval(() => {
      document.getElementById('sys-clock').innerText = new Date().toLocaleTimeString();
    }, 1000);

    const arcCore = document.getElementById('arc-core');
    const arcLabel = document.getElementById('arc-label');
    const dialogueBox = document.getElementById('dialogue-box');
    const userInput = document.getElementById('user-input');
    const sendBtn = document.getElementById('send-btn');

    function speak(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.pitch = 0.95;
        utterance.rate = 1.0;
        window.speechSynthesis.speak(utterance);
      }
    }

    function addLog(speaker, message, color = 'text-cyan-300') {
      const p = document.createElement('p');
      p.className = color + ' text-xs';
      p.innerText = `${speaker}: ${message}`;
      dialogueBox.appendChild(p);
      dialogueBox.scrollTop = dialogueBox.scrollHeight;
    }

    function processCommand(cmd) {
      if (!cmd.trim()) return;
      addLog('User', cmd, 'text-slate-300');
      const cleanCmd = cmd.toLowerCase();

      setTimeout(() => {
        let reply = "Executing requested parameter. All protocols operational.";
        if (cleanCmd.includes('time') || cleanCmd.includes('date')) {
          reply = `The current time is ${new Date().toLocaleTimeString()} on ${new Date().toLocaleDateString()}.`;
        } else if (cleanCmd.includes('who are you') || cleanCmd.includes('jarvis')) {
          reply = "I am J.A.R.V.I.S., your autonomous personal assistant, configured to assist with complete consent verification.";
        } else if (cleanCmd.includes('status')) {
          reply = "All system channels nominal. Audio visualizers and consent encryption active.";
        } else {
          reply = `Acknowledged: "${cmd}". Task logged in operational queue.`;
        }
        addLog('J.A.R.V.I.S.', reply, 'text-cyan-300 font-medium');
        speak(reply);
      }, 500);
    }

    sendBtn.addEventListener('click', () => {
      const text = userInput.value;
      if (text) {
        processCommand(text);
        userInput.value = '';
      }
    });

    userInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') sendBtn.click();
    });

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SpeechRecognition) {
      const recognizer = new SpeechRecognition();
      recognizer.continuous = false;
      recognizer.interimResults = false;

      arcCore.addEventListener('click', () => {
        arcLabel.innerText = "LISTENING";
        arcCore.classList.remove('border-cyan-300');
        arcCore.classList.add('border-emerald-400');
        recognizer.start();
      });

      recognizer.onresult = (e) => {
        const text = e.results[0][0].transcript;
        processCommand(text);
      };

      recognizer.onend = () => {
        arcLabel.innerText = "STANDBY";
        arcCore.classList.remove('border-emerald-400');
        arcCore.classList.add('border-cyan-300');
      };

      recognizer.onerror = () => {
        arcLabel.innerText = "STANDBY";
        arcCore.classList.remove('border-emerald-400');
        arcCore.classList.add('border-cyan-300');
      };
    } else {
      arcCore.addEventListener('click', () => {
        alert("Speech Recognition not supported in this browser view. Type your command below.");
      });
    }
  </script>
</body>
</html>
